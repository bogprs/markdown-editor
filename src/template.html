<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Markdown Editor</title>
<meta name="description" content="Offline Markdown editor with preview and table of contents">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%%FAVICON%%">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
%%CSS%%
</style>
</head>
<body>
<div id="splash" aria-hidden="true">%%LOGO%%</div>
<header id="bar">
  <div class="seg" role="tablist" aria-label="View">
    <button role="tab" data-view="toc" aria-selected="false">TOC</button>
    <button role="tab" data-view="edit" aria-selected="true">Edit</button>
    <button role="tab" data-view="preview" aria-selected="false">Preview</button>
  </div>
  <button id="menuBtn" aria-label="File menu" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
    <span id="dirtyDot" hidden></span>
  </button>
</header>

<main>
  <textarea id="ed" class="view on" spellcheck="true" autocapitalize="sentences" autocomplete="off"
    placeholder="Start typing Markdown…&#10;&#10;# Header&#10;Some **bold** text, a list:&#10;- [ ] task&#10;&#10;Double-tap a header to jump to Preview."
    aria-label="Markdown source"></textarea>
  <div id="pv" class="view"><article id="pvBody" class="md"></article></div>
  <nav id="toc" class="view" aria-label="Table of contents"></nav>
  <div id="mirror" aria-hidden="true"></div>
</main>

<div id="scrim" hidden></div>
<div id="menu" role="menu" hidden>
  <div id="fileInfo"><div id="fileName"></div><div id="fileState"></div></div>
  <div id="recent" hidden></div>
  <button role="menuitem" data-act="new"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg>New</button>
  <button role="menuitem" data-act="open"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>Open…</button>
  <button role="menuitem" data-act="save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Save</button>
  <button role="menuitem" data-act="saveas"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M12 10v7M9 14l3 3 3-3"/></svg>Save as…</button>
  <button role="menuitem" data-act="install" hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>Install app</button>
</div>

<dialog id="dlg">
  <p id="dlgText"></p>
  <div class="dlgBtns"><button id="dlgCancel">Cancel</button><button id="dlgOk" class="danger">Discard</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" hidden>

<script>
%%LIB_MARKED%%
</script>
<script>
%%LIB_PURIFY%%
</script>
<script>
%%JS%%
</script>
<!-- Heavy libraries are stored as inert text and only evaluated when a document needs them. -->
<script type="text/plain" id="lib-hljs">%%LIB_HLJS%%</script>
<script type="text/plain" id="lib-katex">%%LIB_KATEX%%</script>
<script type="text/plain" id="lib-katex-css">%%LIB_KATEX_CSS%%</script>
<script type="text/plain" id="lib-mermaid">%%LIB_MERMAID%%</script>
</body>
</html>
